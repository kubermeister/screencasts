# yaml-language-server: $schema=../../schema/script.schema.json
id: object-kinds
title: Object kinds
since: 0.10.0
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice: kokoro
beats:
  - id: intro
    text: { kind: title, value: 'The long tail of kinds, each with its own screen' }
    say: 'Kubermeister gives the long tail of kinds a screen of their own, with the columns each one needs.'
  - id: replicasets
    text:
      kind: callout
      value: 'Each Replica Set names the Deployment above it'
      anchor: replicaset
      side: auto
    say: 'Replica sets, each naming the deployment above it, read from its owner reference.'
    hold: 2.4s
  - id: budgets
    text:
      kind: callout
      value: 'A budget that allows no disruption reads Blocked'
      anchor: budget
      side: auto
    say: 'Disruption budgets, where one that allows no disruption reads blocked.'
    hold: 2.4s
  - id: priorityclasses
    text:
      kind: callout
      value: 'Priority Classes: value, preemption and the default'
      anchor: priorityclass
      side: auto
    say: 'Priority classes, with their value, their preemption policy, and which one is the default.'
    hold: 2.4s
  - id: runtimeclasses
    text: { kind: caption, value: 'Runtime Classes: the handler and its node selector' }
    say: 'Runtime classes, with the handler and the nodes it selects.'
    hold: 2s
  - id: admissionpolicies
    text:
      kind: callout
      value: 'Admission policies, next to the mutating and validating webhooks'
      anchor: policy
      side: auto
    say: 'Validating admission policies, listed next to the mutating and validating webhooks.'
    hold: 2.4s
  - id: leases
    text: { kind: caption, value: 'Leases: who holds each lock, and when it was renewed' }
    say: 'And leases: switch to kube system to see who holds each lock, and when it was last renewed.'
    hold: 2.4s
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
