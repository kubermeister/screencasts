# yaml-language-server: $schema=../../schema/script.schema.json
id: command-palette
title: Command palette
since: 0.2.0
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice:
  provider: kokoro
  voice: af_heart
beats:
  - id: intro
    text: { kind: title, value: 'Go anywhere from the keyboard' }
    say: 'Kubermeister takes you to any screen or resource without touching the mouse.'
  - id: open
    text: { kind: caption, value: 'Press ⌘K on any screen' }
    say: 'Press command K on any screen to open the palette.'
  - id: search
    text:
      kind: callout
      value: 'Type a few letters of any screen or resource'
      anchor: deployments-option
      side: auto
    say: 'Type a few letters of what you want, and the matches narrow as you go.'
    hold: 1.6s
  - id: arrive
    text: { kind: caption, value: 'Straight to every deployment in the namespace' }
    say: 'Press enter, and you are looking at every deployment in the namespace.'
    hold: 2s
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
