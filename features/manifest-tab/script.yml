# yaml-language-server: $schema=../../schema/script.schema.json
id: manifest-tab
title: Manifest tab
since: 0.10.0
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice: kokoro
beats:
  - id: intro
    text: { kind: title, value: 'The object as the cluster holds it' }
    say: 'The Manifest tab shows any object exactly as the cluster holds it, in YAML.'
  - id: manifest
    text:
      kind: callout
      value: 'The live YAML from the API server, every field the cluster keeps'
      anchor: yaml
      side: auto
    say: 'The live YAML is read from the API server, with every field the cluster keeps.'
    hold: 2.4s
  - id: data
    zoom: data
    text:
      kind: callout
      value: 'Keys, values and whole files, as YAML'
      anchor: data
      side: auto
    say: 'A config map reads as its keys, its values and its whole files, multi-line blocks included.'
    hold: 2.4s
  - id: download
    text:
      kind: callout
      value: 'Download saves the manifest as a YAML file'
      anchor: download
      side: auto
    say: 'Download saves the manifest as a YAML file, named after the object.'
    hold: 2.2s
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
