# yaml-language-server: $schema=../../../schema/script.schema.json
id: namespace-selector
title: Namespace selector
since: 0.10.0
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice: kokoro
# The scene ends back on production, the namespace every other video starts in.
beats:
  - id: intro
    text: { kind: title, value: 'One namespace, or all of them' }
    say: 'The namespace selector in the top bar scopes every list in Kubermeister to one namespace, or to all of them at once.'
  - id: selector
    text:
      kind: callout
      value: 'The top bar names the namespace every list is scoped to'
      anchor: selector
      side: auto
    say: 'The top bar names the namespace every list is scoped to.'
    hold: 2s
  - id: staging
    text: { kind: caption, value: 'Namespace › staging' }
    say: 'Pick staging, and the pods list is staging only.'
    hold: 2s
  - id: all
    text:
      kind: callout
      value: 'All namespaces: every pod at once, with a Namespace column'
      anchor: namespace-column
      side: auto
    say: 'Pick All namespaces, and every pod in the cluster is listed at once, with a Namespace column to tell them apart.'
    hold: 2.6s
  - id: context
    text:
      kind: callout
      value: 'The context beside it switches clusters the same way'
      anchor: context
      side: auto
    say: 'The context beside it switches clusters the same way, straight from your kubeconfig.'
    hold: 2.2s
  - id: back
    text: { kind: caption, value: 'Namespace › production' }
    say: 'And back to production.'
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
