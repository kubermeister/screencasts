# yaml-language-server: $schema=../../../schema/script.schema.json
id: list-columns
title: List columns
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice: kokoro
beats:
  - id: intro
    text: { kind: title, value: 'Each list remembers its columns' }
    say: 'Every list in Kubermeister lets you choose its columns, and remembers the choice for that screen.'
  - id: chooser
    text:
      kind: callout
      value: 'Columns lists every column of the screen'
      anchor: menu
      side: auto
    say: 'Open Columns on the pods list, and every column of the screen is there to tick.'
    hold: 2s
  - id: hide
    text:
      kind: callout
      value: 'Untick what you do not need, and the list narrows at once'
      anchor: menu
      side: auto
    say: 'Untick what you do not need, and the list narrows at once.'
    hold: 2.2s
  - id: kept
    text:
      kind: callout
      value: 'Leave and come back: the choice is kept, per screen'
      anchor: menu
      side: auto
    say: 'Leave the screen and come back, and the same columns are still unticked. Each list keeps a choice of its own.'
    hold: 2.6s
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
