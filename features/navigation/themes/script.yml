# yaml-language-server: $schema=../../../schema/script.schema.json
id: themes
title: Themes
since: 0.10.0
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice: kokoro
beats:
  - id: intro
    text: { kind: title, value: 'Light or dark, the whole workspace at once' }
    say: 'Kubermeister comes in a light and a dark theme, and switches the whole workspace at once.'
  - id: appearance
    text: { kind: caption, value: 'Settings › Appearance › Theme' }
    say: 'Open Settings, then Appearance. The theme cards are Light, Dark and System.'
  - id: light
    text:
      kind: callout
      value: 'Light: bright surfaces. System follows your OS.'
      anchor: theme
      side: auto
    say: 'Pick Light, and every screen changes with it.'
    hold: 2s
  - id: summary
    text: { kind: caption, value: 'Every screen follows the theme you chose' }
    say: 'The cluster summary, the lists and every detail screen follow the theme you chose.'
    hold: 2s
  - id: dark
    text: { kind: caption, value: 'Dark: dense night mode, one click back' }
    say: 'Dark is one click away, and System follows your operating system.'
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
