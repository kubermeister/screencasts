# yaml-language-server: $schema=../../../schema/script.schema.json
id: text-size
title: Text size
formats: [video, reel]
theme: dark
# The first provider is the default; `npm run video -- text-size --voice all` renders both. Each
# provider's voice and model come from .env.
voices: [elevenlabs, kokoro]
beats:
  - id: intro
    text: { kind: title, value: 'Make Kubermeister easier to read' }
    say: 'Kubermeister lets you choose how big the text is.'
  - id: open-picker
    text: { kind: caption, value: 'Settings › Appearance › Text size' }
    say: 'Open Settings, then Appearance, and find Text size.'
  - id: larger
    zoom: text-size-picker
    text:
      kind: callout
      value: 'All text scales. Spacing and icons stay put.'
      anchor: text-size-picker
      side: auto
    say: 'Pick Larger, and every piece of text grows, while spacing and icons stay exactly where they were.'
    hold: 2s
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
