# yaml-language-server: $schema=../../schema/script.schema.json
id: export-selection
title: Export selection
since: 0.5.0
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice: kokoro
beats:
  - id: intro
    text: { kind: title, value: 'Export a selection as one YAML file' }
    say: 'Kubermeister saves the rows you select on any list as one YAML file.'
  - id: select
    text:
      kind: callout
      value: 'Check the rows, and the selection bar appears'
      anchor: selection-bar
      side: auto
    say: 'Check the rows you want, and the selection bar appears with export on it.'
    hold: 2s
  - id: menu
    text:
      kind: callout
      value: 'As the cluster holds them, or cleaned for another cluster'
      anchor: menu
      side: auto
    say: 'Save them as the cluster holds them, or cleaned for another cluster: status and the fields the server owns are stripped, so the file applies elsewhere.'
    hold: 2.6s
  - id: saved
    text: { kind: caption, value: 'One file, ready to apply' }
    say: 'One file, ready to apply.'
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
