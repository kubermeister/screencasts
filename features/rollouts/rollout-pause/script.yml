# yaml-language-server: $schema=../../../schema/script.schema.json
id: rollout-pause
title: Rollout pause
since: 0.3.0
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice: kokoro
beats:
  - id: intro
    text: { kind: title, value: 'Pause a rollout, roll back a revision' }
    say: 'Kubermeister pauses and resumes a rollout, and rolls a deployment back to any earlier revision.'
  - id: pause
    text:
      kind: callout
      value: 'Paused: the controller applies no further change'
      anchor: progress
      side: auto
    say: 'Press pause, and the controller applies no further change until you resume. A safe state to edit the manifest in, mid rollout.'
    hold: 2.4s
  - id: resume
    text: { kind: caption, value: 'Resume picks the rollout up where it stopped' }
    say: 'Resume picks the rollout up where it stopped.'
  - id: history
    text:
      kind: callout
      value: 'Roll back restores a revision as a new one'
      anchor: history
      side: auto
    say: 'The history tab lists every revision, and roll back restores one as a new revision, with a patch that only touches what that revision set.'
    hold: 2.6s
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
