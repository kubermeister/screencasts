# yaml-language-server: $schema=../../../schema/script.schema.json
id: scale
title: Scale
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice: kokoro
beats:
  - id: intro
    text: { kind: title, value: 'Scale a workload to an exact number' }
    say: 'Kubermeister scales a deployment from its list, one step at a time or straight to an exact number.'
  - id: steppers
    text: { kind: caption, value: 'The steppers on each row add or remove one replica' }
    say: 'Every row has steppers. One click adds a replica, and the write goes straight to the cluster.'
  - id: exact
    text: { kind: caption, value: 'The button on the hovered row sets an exact count' }
    say: 'Hover the row, and a button opens a field for the exact count you want.'
  - id: written
    text:
      kind: callout
      value: 'Each write is the absolute target, so clicks never race'
      anchor: row
      side: auto
    say: 'Each write is the absolute target, not a delta, so rapid clicks can never race each other. Scale in the detail header does the same.'
    hold: 2.6s
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
