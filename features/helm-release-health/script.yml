# yaml-language-server: $schema=../../schema/script.schema.json
id: helm-release-health
title: Helm release health
since: 0.8.0
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice:
  provider: kokoro
  voice: af_heart
beats:
  - id: intro
    text: { kind: title, value: 'A release judged by its objects' }
    say: 'Kubermeister judges a Helm release by the objects it rendered, read live from the cluster, not by the status Helm recorded.'
  - id: healthy
    text:
      kind: callout
      value: 'Every object of the revision, with its own live status'
      anchor: release-health
      side: auto
    say: 'The resources tab lists every object of the current revision with its own status, and rolls them up into one health.'
    hold: 2.2s
  - id: missing
    text: { kind: caption, value: 'A config map of the release is deleted' }
    say: 'If a config map of the release goes missing,'
  - id: failing
    text:
      kind: callout
      value: 'The roll-up names the object that is wrong'
      anchor: worst-object
      side: auto
    say: 'the release turns failing, and the health card names the object that is missing.'
    hold: 2.6s
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
