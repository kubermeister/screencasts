# yaml-language-server: $schema=../../../schema/script.schema.json
id: custom-resources
title: Custom resources
formats: [video, reel]
theme: dark
# Kokoro only: it runs locally for free. Paid voices (ElevenLabs, OpenAI) are added by the maintainer.
voice: kokoro
beats:
  - id: intro
    text: { kind: title, value: 'Your CRDs, with their own columns' }
    say: 'Kubermeister lists the instances of any custom resource definition, with the columns the definition itself declares.'
  - id: definition
    text: { kind: caption, value: 'Add-ons › CRDs › a definition › View instances' }
    say: 'Open a definition under add-ons, and press view instances.'
  - id: instances
    text:
      kind: callout
      value: 'Depth, Consumers, Ready: the printer columns, as kubectl shows them'
      anchor: instances
      side: auto
    say: "The columns come from the definition's printer columns, the same ones kubectl get would print. Each instance opens and edits like any built-in kind."
    hold: 2.6s
  - id: outro
    text: { kind: end-card, value: 'kubermeister.dev' }
